# MODULE-OWNED, kept twinned with foundryvtt-acks-extras' copy — an edit to
# one is an edit to both, differing only in this repo's book-connection
# fields. The extras site's "Report a bug" page describes these fields; keep
# it in step. Reports filed here are triaged through the acks-bug-triage
# pipeline.
name: Bug report
description: Something in ACKS II — Importer misbehaved while connecting or importing a book
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. One rule before anything else: **never attach
        a book PDF or page scan, and never paste book text** — name the book
        and page instead (e.g. "ACKS II Revised Rulebook p. 47"). The books
        stay yours; only your description of the problem belongs here.
  - type: input
    id: module-version
    attributes:
      label: Module version
      description: Foundry → Game Settings → Manage Modules, next to ACKS II — Importer.
      placeholder: "2.4.5"
    validations:
      required: true
  - type: input
    id: foundry-version
    attributes:
      label: Foundry VTT version
      placeholder: "14.364"
    validations:
      required: true
  - type: input
    id: book
    attributes:
      label: Which book
      description: The book you were connecting or importing from, by name — and which printing/PDF release if you know it.
      placeholder: "ACKS II Revised Rulebook"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did and what you saw — connecting the book, which import you ran, what came out wrong or not at all. Name pages by number, not by content.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What should have imported, or how it should have looked. A book-and-page citation helps (citation only — no quoted text).
    validations:
      required: false
  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Press F12, open the Console tab, and paste anything red from the moment it went wrong.
      render: text
    validations:
      required: false
  - type: textarea
    id: other-modules
    attributes:
      label: Other modules enabled
      description: Especially ACKS II — Extras and its version. "Does it still happen with only this module and its requirements enabled?" is the first question we will ask.
    validations:
      required: false
